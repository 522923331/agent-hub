server:
  port: 8088

spring:
  application:
    name: agent-hub
  datasource:
    url: jdbc:h2:file:./data/agenthub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  http:
    timeout-seconds: 30
  scheduler:
    knowledge-ingest:
      enabled: false
      fixed-delay-ms: 21600000
  llm:
    enabled: false
    # OpenAI-compatible: /v1/chat/completions
    base-url: https://api.deepseek.com
    api-key: ${LLM_API_KEY:}
    model: deepseek-chat
    timeout-seconds: 90


