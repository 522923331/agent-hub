<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>订阅管理 - agent-hub</title>
  <link href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" rel="stylesheet"/>
  <link href="/css/app.css" rel="stylesheet"/>
</head>
<body>
<main class="container">
  <nav>
    <ul>
      <li><strong>agent-hub</strong></li>
    </ul>
    <ul>
      <li><a data-nav href="/">首页</a></li>
      <li><a data-nav href="/subscriptions.html" class="active">订阅管理</a></li>
      <li><a data-nav href="/articles.html">文章管理</a></li>
    </ul>
  </nav>

  <h1>订阅管理</h1>
  <p class="muted">增删改查 + 启用/禁用 + 分页搜索。禁用的订阅不会被拉取。</p>

  <article>
    <div class="toolbar">
      <div class="grow">
        <label for="q">搜索（名称/URL/tag/中文名/能力总结）</label>
        <input id="q" type="text" placeholder="例如：科技创业 / TechCrunch / 管理"/>
      </div>
      <div class="fixed">
        <label for="enabled">状态</label>
        <select id="enabled">
          <option value="">全部</option>
          <option value="true">仅启用</option>
          <option value="false">仅禁用</option>
        </select>
      </div>
      <div class="fixed">
        <label>&nbsp;</label>
        <div class="btn-row">
          <button id="btnNew" class="contrast">新增</button>
          <button id="btnRefresh" class="secondary">刷新</button>
        </div>
      </div>
    </div>
    <p id="err" style="margin-top:0.4rem;color:#b00020;"></p>
    <p id="meta" class="muted"></p>
  </article>

  <div id="list" class="list">
    <div class="card">加载中…</div>
  </div>

  <article>
    <div class="grid">
      <div>
        <button id="prev" class="secondary">上一页</button>
        <button id="next" class="secondary">下一页</button>
      </div>
      <div>
        <label>&nbsp;</label>
        <span id="pagerMeta" class="muted"></span>
      </div>
      <div>
        <label for="page">页码</label>
        <input id="page" type="number" min="1" value="1"/>
      </div>
      <div>
        <label for="size">每页</label>
        <select id="size">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="go" class="contrast">跳转</button>
      </div>
    </div>
  </article>
</main>

<dialog id="dlg">
  <article>
    <header style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;">
      <strong id="dlgTitle">订阅</strong>
      <a href="#" aria-label="Close" class="secondary" id="dlgClose">✕</a>
    </header>
    <div class="grid">
      <div>
        <label>英文名（必填）</label>
        <input id="fName" type="text" placeholder="TechCrunch"/>
      </div>
      <div>
        <label>sourceType</label>
        <input id="fType" type="text" value="RSS"/>
      </div>
    </div>
    <label>中文名（必填）</label>
    <input id="fZhName" type="text" placeholder="科技创业新鲜事"/>
    <label>网站能力总结（必填）</label>
    <textarea id="fCap" rows="3" placeholder="用一句话说明内容价值"></textarea>
    <label>feedUrl（必填）</label>
    <input id="fUrl" type="text" placeholder="https://example.com/feed"/>
    <div class="grid">
      <div>
        <label>tags（逗号分隔）</label>
        <input id="fTags" type="text" placeholder="tech,innovation"/>
      </div>
      <div>
        <label>fetchLimit</label>
        <input id="fLimit" type="number" value="10" min="1" max="200"/>
      </div>
    </div>
    <label><input id="fEnabled" type="checkbox" checked/> 启用</label>
    <footer style="display:flex;justify-content:flex-end;gap:.5rem;">
      <button class="secondary" id="dlgCancel">取消</button>
      <button class="contrast" id="dlgSave">保存</button>
    </footer>
  </article>
</dialog>

<script type="module" src="/js/subscriptions.js"></script>
</body>
</html>
