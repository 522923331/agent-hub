<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>agent-hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" rel="stylesheet"/>
    <style>
        :root{
            --font-size: 14px;
            --line-height: 1.35;
            --spacing: .55rem;
        }
        body { font-size: 14px; }
        h1 { font-size: 1.25rem; margin-bottom: .35rem; }
        p { margin: .25rem 0 .5rem; }
        article { padding: .75rem; }
        .hidden { display: none; }
        .tabs a[aria-current="page"] { font-weight: 700; text-decoration: underline; }

        /* tighter form controls */
        input, select, button { font-size: 0.92rem; }
        input, select { padding: .35rem .5rem; }
        button { padding: .35rem .6rem; }

        /* compact tables */
        table { font-size: 0.92rem; }
        td, th { padding: .4rem .5rem; }

        /* subscription list cards */
        .toolbar { display: flex; gap: .5rem; align-items: end; flex-wrap: wrap; }
        .toolbar .grow { flex: 1 1 18rem; min-width: 14rem; }
        .toolbar .fixed { flex: 0 0 auto; }
        .muted { color: #666; font-size: .9em; }
        .pill { display:inline-block; padding: .12rem .45rem; border-radius: 999px; border: 1px solid rgba(0,0,0,.15); font-size: .85em; }
        .pill.on { background: rgba(0,128,0,.08); border-color: rgba(0,128,0,.25); }
        .pill.off { background: rgba(176,0,32,.06); border-color: rgba(176,0,32,.18); }
        .sub-list { display: grid; gap: .5rem; }
        .sub-card { border: 1px solid rgba(0,0,0,.12); border-radius: .6rem; padding: .6rem .7rem; background: #fff; }
        .sub-row { display:flex; gap:.6rem; align-items:flex-start; justify-content:space-between; }
        .sub-main { min-width: 0; flex: 1 1 auto; }
        .sub-actions { display:flex; gap:.35rem; flex: 0 0 auto; align-items:center; }
        .sub-title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub-url { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .sub-meta { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.25rem; }

        dialog { border: none; border-radius: .8rem; padding: 0; width: min(720px, 96vw); }
        dialog article { margin: 0; border-radius: .8rem; }
        dialog::backdrop { background: rgba(0,0,0,.45); }
    </style>
</head>
<body>
<main class="container">
    <nav>
        <ul>
            <li><strong>agent-hub</strong></li>
        </ul>
        <ul class="tabs">
            <li><a href="#llm" id="tab-llm">LLM模型</a></li>
            <li><a href="#subscriptions" id="tab-subscriptions">订阅管理</a></li>
            <li><a href="/api/agents" target="_blank" rel="noreferrer">agents API</a></li>
        </ul>
    </nav>

    <!-- LLM MODELS -->
    <section id="panel-llm">
        <h1>LLM 可用模型</h1>
        <p>调用当前配置的 OpenAI-compatible <code>/v1/models</code>，展示可用模型列表。</p>

        <article>
            <div class="grid">
                <div>
                    <label for="llm-q">搜索（按模型 ID）</label>
                    <input id="llm-q" type="text" placeholder="例如：deepseek-chat"/>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <button id="llm-refresh" class="contrast">刷新</button>
                </div>
            </div>
            <p id="llm-meta" style="margin-top: 0.5rem; color: #666;"></p>
            <p id="llm-err" style="margin-top: 0.5rem; color: #b00020;"></p>
        </article>

        <table role="grid">
            <thead>
            <tr>
                <th>模型 ID</th>
                <th>owned_by</th>
                <th>object</th>
            </tr>
            </thead>
            <tbody id="llm-tbody">
            <tr><td colspan="3">加载中…</td></tr>
            </tbody>
        </table>
    </section>

    <!-- SUBSCRIPTIONS -->
    <section id="panel-subscriptions" class="hidden">
        <h1>订阅管理</h1>
        <p>对 <code>knowledge_subscription</code> 做增删改查，并支持启用/禁用。</p>

        <article>
            <div class="toolbar">
                <div class="grow">
                    <label for="sub-q">搜索（名称/URL/tag）</label>
                    <input id="sub-q" type="text" placeholder="例如：techcrunch / aeon / health"/>
                </div>
                <div class="fixed">
                    <label for="sub-enabled">状态</label>
                    <select id="sub-enabled">
                        <option value="">全部</option>
                        <option value="true">仅启用</option>
                        <option value="false">仅禁用</option>
                    </select>
                </div>
                <div class="fixed">
                    <label>&nbsp;</label>
                    <div style="display:flex; gap:.4rem;">
                        <button id="sub-new" class="contrast">新增</button>
                        <button id="sub-refresh" class="secondary">刷新</button>
                    </div>
                </div>
            </div>
            <p id="sub-err" style="margin-top: 0.4rem; color: #b00020;"></p>
            <p id="sub-meta" class="muted"></p>
        </article>

        <div id="sub-list" class="sub-list">
            <div class="sub-card">加载中…</div>
        </div>

        <article>
            <div class="grid">
                <div>
                    <button id="sub-prev" class="secondary">上一页</button>
                    <button id="sub-next" class="secondary">下一页</button>
                </div>
                <div>
                    <label for="sub-page">页码</label>
                    <input id="sub-page" type="number" min="1" value="1"/>
                </div>
                <div>
                    <label for="sub-size">每页</label>
                    <select id="sub-size">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <button id="sub-go" class="contrast">跳转</button>
                </div>
            </div>
        </article>
    </section>
</main>

<!-- subscription dialog -->
<dialog id="sub-dialog">
    <article>
        <header style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;">
            <strong id="dlg-title">订阅</strong>
            <a href="#" aria-label="Close" class="secondary" id="dlg-close">✕</a>
        </header>
        <div class="grid">
            <div>
                <label>英文名（必填）</label>
                <input id="dlg-name" type="text" placeholder="TechCrunch"/>
            </div>
            <div>
                <label>sourceType</label>
                <input id="dlg-type" type="text" value="RSS"/>
            </div>
        </div>
        <label>中文名（必填）</label>
        <input id="dlg-zh-name" type="text" placeholder="科技创业新鲜事"/>

        <label>网站能力总结（必填）</label>
        <textarea id="dlg-cap" rows="3" placeholder="用一句话说明这个站点的内容价值，给不熟悉该站点的读者一个直观认知。"></textarea>

        <label>feedUrl</label>
        <input id="dlg-url" type="text" placeholder="https://example.com/feed"/>

        <div class="grid">
            <div>
                <label>tags（逗号分隔）</label>
                <input id="dlg-tags" type="text" placeholder="tech,innovation"/>
            </div>
            <div>
                <label>fetchLimit</label>
                <input id="dlg-limit" type="number" value="10" min="1" max="200"/>
            </div>
        </div>

        <label>
            <input id="dlg-enabled" type="checkbox" checked />
            启用
        </label>

        <footer style="display:flex;justify-content:flex-end;gap:.5rem;">
            <button class="secondary" id="dlg-cancel">取消</button>
            <button class="contrast" id="dlg-save">保存</button>
        </footer>
    </article>
</dialog>

<script>
    // ---------- shared ----------
    function escapeHtml(s) {
        return String(s)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function showTab(tab) {
        const isLlm = tab === 'llm';
        document.getElementById('panel-llm').classList.toggle('hidden', !isLlm);
        document.getElementById('panel-subscriptions').classList.toggle('hidden', isLlm);
        document.getElementById('tab-llm').setAttribute('aria-current', isLlm ? 'page' : 'false');
        document.getElementById('tab-subscriptions').setAttribute('aria-current', !isLlm ? 'page' : 'false');
    }

    function route() {
        const h = (location.hash || '#llm').replace('#', '');
        if (h === 'subscriptions') showTab('subscriptions');
        else showTab('llm');
    }
    window.addEventListener('hashchange', route);

    // ---------- LLM models ----------
    const llmTbody = document.getElementById('llm-tbody');
    const llmErr = document.getElementById('llm-err');
    const llmMeta = document.getElementById('llm-meta');
    const llmQ = document.getElementById('llm-q');
    const llmRefresh = document.getElementById('llm-refresh');
    let llmAll = [];

    function llmRender(list) {
        llmTbody.innerHTML = '';
        if (!list || list.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="3">暂无数据</td>';
            llmTbody.appendChild(tr);
            return;
        }
        for (const m of list) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><code>${escapeHtml(m.id || '')}</code></td>
                            <td>${escapeHtml(m.ownedBy || '')}</td>
                            <td>${escapeHtml(m.object || '')}</td>`;
            llmTbody.appendChild(tr);
        }
    }

    function llmApplyFilter() {
        const key = (llmQ.value || '').trim().toLowerCase();
        if (!key) return llmRender(llmAll);
        llmRender(llmAll.filter(x => (x.id || '').toLowerCase().includes(key)));
    }

    async function llmLoad() {
        llmErr.textContent = '';
        llmMeta.textContent = '';
        llmTbody.innerHTML = '<tr><td colspan="3">加载中…</td></tr>';
        try {
            const r = await fetch('/api/llm/models');
            const j = await r.json();
            if (!r.ok) throw new Error(j && j.error ? j.error : ('HTTP ' + r.status));
            llmAll = j.models || [];
            llmMeta.textContent = `baseUrl: ${j.baseUrl || '-'}；当前模型: ${j.currentModel || '-'}；总数: ${llmAll.length}`;
            llmApplyFilter();
        } catch (e) {
            llmAll = [];
            llmRender([]);
            llmErr.textContent = '加载失败：' + (e && e.message ? e.message : String(e));
        }
    }
    llmQ.addEventListener('input', llmApplyFilter);
    llmRefresh.addEventListener('click', llmLoad);

    // ---------- subscriptions ----------
    const subList = document.getElementById('sub-list');
    const subErr = document.getElementById('sub-err');
    const subMeta = document.getElementById('sub-meta');
    const subQ = document.getElementById('sub-q');
    const subEnabled = document.getElementById('sub-enabled');
    const subRefresh = document.getElementById('sub-refresh');
    const subNew = document.getElementById('sub-new');
    const subPrev = document.getElementById('sub-prev');
    const subNext = document.getElementById('sub-next');
    const subPage = document.getElementById('sub-page');
    const subSize = document.getElementById('sub-size');
    const subGo = document.getElementById('sub-go');

    const dlg = document.getElementById('sub-dialog');
    const dlgTitle = document.getElementById('dlg-title');
    const dlgClose = document.getElementById('dlg-close');
    const dlgCancel = document.getElementById('dlg-cancel');
    const dlgSave = document.getElementById('dlg-save');
    const dlgName = document.getElementById('dlg-name');
    const dlgZhName = document.getElementById('dlg-zh-name');
    const dlgCap = document.getElementById('dlg-cap');
    const dlgType = document.getElementById('dlg-type');
    const dlgUrl = document.getElementById('dlg-url');
    const dlgTags = document.getElementById('dlg-tags');
    const dlgLimit = document.getElementById('dlg-limit');
    const dlgEnabled = document.getElementById('dlg-enabled');
    let dlgMode = 'create';
    let dlgId = null;
    let subAll = [];
    let subPageIdx = 0;
    let subTotalPages = 1;
    let subTotalElements = 0;

    function subRender(list) {
        subList.innerHTML = '';
        if (!list || list.length === 0) {
            const div = document.createElement('div');
            div.className = 'sub-card';
            div.textContent = '暂无数据';
            subList.appendChild(div);
            return;
        }
        for (const s of list) {
            const div = document.createElement('div');
            div.className = 'sub-card';

            const enabledPill = s.enabled
                ? `<span class="pill on">启用</span>`
                : `<span class="pill off">禁用</span>`;

            div.innerHTML = `
                <div class="sub-row">
                    <div class="sub-main">
                        <div class="sub-title">#${escapeHtml(s.id)} · ${escapeHtml(s.zhName || '')} <span class="muted">(${escapeHtml(s.name || '')})</span></div>
                        <div class="muted" style="margin-top:.15rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                            ${escapeHtml(s.capabilitySummary || '')}
                        </div>
                        <div class="muted sub-url">${escapeHtml(s.feedUrl || '')}</div>
                        <div class="sub-meta">
                            ${enabledPill}
                            <span class="pill">${escapeHtml(s.sourceType || '')}</span>
                            <span class="pill">limit ${escapeHtml(s.fetchLimit || 20)}</span>
                            ${s.tags ? `<span class="pill">${escapeHtml(s.tags)}</span>` : ''}
                        </div>
                    </div>
                    <div class="sub-actions">
                        <button class="contrast" data-act="edit" data-id="${s.id}">编辑</button>
                        <button class="secondary" data-act="toggle" data-id="${s.id}">${s.enabled ? '禁用' : '启用'}</button>
                        <button class="secondary" data-act="del" data-id="${s.id}">删除</button>
                    </div>
                </div>
            `;
            subList.appendChild(div);
        }
    }

    async function subLoad() {
        subErr.textContent = '';
        subMeta.textContent = '';
        subList.innerHTML = '<div class="sub-card">加载中…</div>';
        try {
            const qv = (subQ.value || '').trim();
            const enabledVal = (subEnabled.value || '').trim();
            const size = parseInt(subSize.value || '20', 10);
            const params = new URLSearchParams();
            params.set('page', String(subPageIdx));
            params.set('size', String(size));
            if (qv) params.set('q', qv);
            if (enabledVal === 'true' || enabledVal === 'false') params.set('enabled', enabledVal);

            const r = await fetch('/api/subscriptions?' + params.toString());
            const j = await r.json();
            if (!r.ok) throw new Error(j && j.error ? j.error : ('HTTP ' + r.status));
            subAll = (j && Array.isArray(j.content)) ? j.content : [];
            subTotalPages = (j && typeof j.totalPages === 'number') ? j.totalPages : 1;
            subTotalElements = (j && typeof j.totalElements === 'number') ? j.totalElements : subAll.length;
            subPage.value = String(subPageIdx + 1);
            subMeta.textContent = `第 ${subPageIdx + 1} / ${Math.max(subTotalPages, 1)} 页 · 总条数 ${subTotalElements}`;
            subRender(subAll);
        } catch (e) {
            subAll = [];
            subTotalPages = 1;
            subTotalElements = 0;
            subRender([]);
            subErr.textContent = '加载失败：' + (e && e.message ? e.message : String(e));
        }
    }

    function openDialog(mode, item) {
        dlgMode = mode;
        dlgId = item && item.id != null ? item.id : null;
        dlgTitle.textContent = mode === 'create' ? '新增订阅' : `编辑订阅 #${dlgId}`;
        dlgName.value = item && item.name ? item.name : '';
        dlgZhName.value = item && item.zhName ? item.zhName : '';
        dlgCap.value = item && item.capabilitySummary ? item.capabilitySummary : '';
        dlgType.value = item && item.sourceType ? item.sourceType : 'RSS';
        dlgUrl.value = item && item.feedUrl ? item.feedUrl : '';
        dlgTags.value = item && item.tags ? item.tags : '';
        dlgLimit.value = item && item.fetchLimit != null ? String(item.fetchLimit) : '10';
        dlgEnabled.checked = item && item.enabled != null ? !!item.enabled : true;
        if (typeof dlg.showModal === 'function') dlg.showModal();
    }

    function closeDialog() {
        if (typeof dlg.close === 'function') dlg.close();
    }

    async function saveDialog() {
        subErr.textContent = '';
        const payload = {
            name: (dlgName.value || '').trim(),
            zhName: (dlgZhName.value || '').trim(),
            capabilitySummary: (dlgCap.value || '').trim(),
            sourceType: (dlgType.value || 'RSS').trim(),
            feedUrl: (dlgUrl.value || '').trim(),
            tags: (dlgTags.value || '').trim(),
            fetchLimit: parseInt(dlgLimit.value || '10', 10),
            enabled: !!dlgEnabled.checked
        };
        if (!payload.name || !payload.zhName || !payload.capabilitySummary || !payload.sourceType || !payload.feedUrl) {
            subErr.textContent = '保存失败：英文名/中文名/能力总结/sourceType/feedUrl 都不能为空';
            return;
        }
        try {
            const isCreate = dlgMode === 'create';
            const url = isCreate ? `/api/subscriptions` : `/api/subscriptions/${dlgId}`;
            const method = isCreate ? 'POST' : 'PUT';
            const r = await fetch(url, {
                method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const j = await r.json();
            if (!r.ok) throw new Error(j && j.error ? j.error : ('HTTP ' + r.status));
            closeDialog();
            await subLoad();
        } catch (e) {
            subErr.textContent = '保存失败：' + (e && e.message ? e.message : String(e));
        }
    }

    async function subDel(id) {
        subErr.textContent = '';
        if (!confirm(`确认删除订阅 #${id} ?`)) return;
        try {
            const r = await fetch(`/api/subscriptions/${id}`, { method: 'DELETE' });
            const j = await r.json();
            if (!r.ok) throw new Error(j && j.error ? j.error : ('HTTP ' + r.status));
            await subLoad();
        } catch (e) {
            subErr.textContent = '删除失败：' + (e && e.message ? e.message : String(e));
        }
    }

    async function subToggle(id) {
        const item = subAll.find(x => String(x.id) === String(id));
        if (!item) return;
        try {
            const payload = { enabled: !item.enabled };
            const r = await fetch(`/api/subscriptions/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const j = await r.json();
            if (!r.ok) throw new Error(j && j.error ? j.error : ('HTTP ' + r.status));
            await subLoad();
        } catch (e) {
            subErr.textContent = '更新失败：' + (e && e.message ? e.message : String(e));
        }
    }

    subList.addEventListener('click', (ev) => {
        const act = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-act') : null;
        const id = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-id') : null;
        if (!act || !id) return;
        if (act === 'edit') {
            const item = subAll.find(x => String(x.id) === String(id));
            if (item) openDialog('edit', item);
        }
        if (act === 'toggle') subToggle(id);
        if (act === 'del') subDel(id);
    });
    function subResetToFirstAndLoad() {
        subPageIdx = 0;
        subLoad();
    }

    subQ.addEventListener('input', () => {
        // 输入即刷新：重置到第一页
        subResetToFirstAndLoad();
    });
    subEnabled.addEventListener('change', subResetToFirstAndLoad);
    subRefresh.addEventListener('click', subResetToFirstAndLoad);
    subNew.addEventListener('click', () => openDialog('create', null));

    dlgClose.addEventListener('click', (e) => { e.preventDefault(); closeDialog(); });
    dlgCancel.addEventListener('click', (e) => { e.preventDefault(); closeDialog(); });
    dlgSave.addEventListener('click', (e) => { e.preventDefault(); saveDialog(); });

    subPrev.addEventListener('click', () => {
        if (subPageIdx <= 0) return;
        subPageIdx -= 1;
        subLoad();
    });
    subNext.addEventListener('click', () => {
        if (subPageIdx + 1 >= subTotalPages) return;
        subPageIdx += 1;
        subLoad();
    });
    subGo.addEventListener('click', () => {
        const want = parseInt(subPage.value || '1', 10);
        if (!Number.isFinite(want)) return;
        const targetIdx = Math.max(0, want - 1);
        subPageIdx = targetIdx;
        subLoad();
    });
    subSize.addEventListener('change', subResetToFirstAndLoad);

    // bootstrap
    route();
    llmLoad();
    subLoad();
</script>
</body>
</html>
